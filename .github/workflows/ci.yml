name: CI

# Pipeline mínimo (seção 16 do enunciado): a cada push/PR, instala dependências,
# valida os tipos, roda os testes automatizados (incluindo os testes metamórficos do
# motor de alocação) e garante que o build de produção do Next.js compila. Uma
# mudança que quebre qualquer uma dessas etapas não deveria chegar ao cliente.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos (TypeScript)
        run: npm run typecheck

      - name: Rodar testes automatizados
        run: npm test

      - name: Build de produção (Next.js)
        run: npm run build
